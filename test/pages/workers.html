<!doctype html>
<script>
  window.__first = { zone: Intl.DateTimeFormat().resolvedOptions().timeZone, offset: new Date().getTimezoneOffset() };
</script>
<meta charset="utf-8">
<title>Sojourn workers</title>
<body>
<script>
  // Each worker reports the zone from its own first line.
  const body = 'const first = { zone: Intl.DateTimeFormat().resolvedOptions().timeZone, offset: new Date().getTimezoneOffset() };'
    + 'postMessage(first);';
  const url = URL.createObjectURL(new Blob([body], { type: 'text/javascript' }));

  const heard = (worker) => new Promise((tell) => worker.addEventListener('message', (event) => tell(event.data)));

  const dedicated = new Worker(url);
  const module = new Worker(url, { type: 'module' });

  const service = navigator.serviceWorker.register('sw.js').then(async () => {
    const registration = await navigator.serviceWorker.ready;
    const worker = registration.active;
    return new Promise((tell) => {
      navigator.serviceWorker.addEventListener('message', (event) => tell(event.data));
      worker.postMessage('zone?');
    });
  });

  window.__workers = Promise.all([heard(dedicated), heard(module), service]).then(
    ([dedicatedFirst, moduleFirst, serviceFirst]) => ({ dedicated: dedicatedFirst, module: moduleFirst, service: serviceFirst }),
  );
</script>
