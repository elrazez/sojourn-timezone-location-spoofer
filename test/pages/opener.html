<!doctype html>
<script>
  window.__first = { zone: Intl.DateTimeFormat().resolvedOptions().timeZone, offset: new Date().getTimezoneOffset() };
</script>
<meta charset="utf-8">
<title>Sojourn opener</title>
<body>
<button id="open">open</button>
<script>
  // A real click, because a popup opened without a user gesture is blocked.
  document.getElementById('open').addEventListener('click', () => {
    window.open(new URLSearchParams(location.search).get('target'));
  });
</script>
