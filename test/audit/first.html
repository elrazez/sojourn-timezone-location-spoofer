<!doctype html>
<script>
  // The first script in the document: the zone it observes, and a position call started right here,
  // which is what the first-script gap measurement reads back.
  window.__first = {
    zone: Intl.DateTimeFormat().resolvedOptions().timeZone,
    offset: new Date().getTimezoneOffset(),
  };
  window.__firstPosition = new Promise((done) => {
    navigator.geolocation.getCurrentPosition(
      (position) =>
        done({
          latitude: position.coords.latitude,
          longitude: position.coords.longitude,
          accuracy: position.coords.accuracy,
        }),
      (error) => done({ code: error.code }),
      { timeout: 5000 },
    );
  });
</script>
<meta charset="utf-8">
<title>Spoofer audit first script</title>
<p>Spoofer audit first script</p>
